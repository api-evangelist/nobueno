name: NoBueno
description: >-
  NoBueno is a job-and-candidate matching platform (a 500 Global portfolio company)
  built around its Django REST Framework "Jungle API". The API powers job postings,
  candidate profiles and work experience, hiring-company and employer records, scored
  job-to-candidate matching, a skills / roles / disciplines taxonomy, recruiter-candidate
  messaging, and notifications. Authentication is a bearer token obtained via
  login / register, and list endpoints use page-number pagination with free-text search,
  ordering, and field-level filtering.
