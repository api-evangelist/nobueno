swagger: '2.0'
info:
  title: Jungle admin refresh API
  description: Here magic happens
  termsOfService: https://www.google.com/policies/terms/
  contact:
    email: mindru.ion97@gmail.com
  license:
    name: BSD License
  version: v1
host: api.nobueno.com
basePath: /api
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- Bearer: []
- Device-type: []
- REFETCH_SCHEMA_WITH_AUTH: []
- x-app-id: []
- x-scheme: []
tags:
- name: refresh
paths:
  /refresh:
    parameters: []
    post:
      operationId: refresh_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/TokenRefresh'
      responses:
        '200':
          description: Respond with jwt access&refresh token, refresh is returned in case if
          schema:
            $ref: '#/definitions/ReturnJWTTokens'
      tags:
      - refresh
definitions:
  ReturnJWTTokens:
    required:
    - access_token
    - refresh_token
    type: object
    properties:
      access_token:
        title: Access token
        type: string
        minLength: 1
      refresh_token:
        title: Refresh token
        type: string
        minLength: 1
  TokenRefresh:
    required:
    - refresh
    type: object
    properties:
      refresh:
        title: Refresh
        type: string
        minLength: 1
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
  Device-type:
    type: apiKey
    name: Device-Type
    in: header
  x-scheme:
    type: apiKey
    name: x-scheme
    in: header
  x-app-id:
    type: apiKey
    name: x-app-id
    in: header
  REFETCH_SCHEMA_WITH_AUTH: true
