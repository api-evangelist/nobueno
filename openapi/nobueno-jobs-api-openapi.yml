          maximum: 2147483647
          minimum: -2147483648
        language:
          title: Language
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        salary:
          title: Salary
          type: string
          readOnly: true
        salary_currency:
          $ref: '#/components/schemas/Currency'
        show_salary:
          title: Show salary
          type: boolean
    ReturnDiscipline:
      required:
      - title
