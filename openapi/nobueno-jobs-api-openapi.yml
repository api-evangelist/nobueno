components:
  schemas:
    Currency:
      title: Salary currency
      required:
      - title
      - name
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Title
          type: string
          minLength: 1
        name:
          title: Name
          type: string
          minLength: 1
        rates:
          title: Rates
          type: string
          readOnly: true
    CandidatesForJob:
      required:
      - id
      - country
      - freelance_salary
      - updated_at
      - city
      - user_id
      - nickname
      - name
      - matched_technical_skills
      type: object
      properties:
        id:
          title: Id
          type: integer
        country:
          $ref: '#/components/schemas/CountryName'
        job_title:
          title: Job title
          type: string
          readOnly: true
        freelance_salary:
          title: Freelance salary
          type: string
          minLength: 1
        technical_score:
          title: Technical score
          type: string
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
        chat:
          title: Chat
          type: string
          readOnly: true
        minimum_salaries:
          title: Minimum salaries
          type: string
          readOnly: true
        value_score:
          title: Value score
          type: string
          readOnly: true
        soft_score:
          title: Soft score
          type: string
          readOnly: true
        language_score:
          title: Language score
          type: string
          readOnly: true
        personal_score:
          title: Personal score
          type: string
          readOnly: true
        candidate_status:
          title: Candidate status
          type: string
          readOnly: true
        working_years:
          title: Working years
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        city:
          $ref: '#/components/schemas/CityName'
        best_match:
          title: Best match
          type: string
          readOnly: true
        user_id:
          title: User id
          type: integer
        match_id:
          title: Match id
          type: string
          readOnly: true
        nickname:
          title: Nickname
          type: string
          minLength: 1
        name:
          title: Name
          type: string
          minLength: 1
        matched_technical_skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
    ShareJob:
      required:
      - emails
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            minLength: 1
    StepMatchRate:
      title: Matches
      type: object
      properties:
        values_match:
          title: Values match
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        personalities_match:
          title: Personalities match
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        technical_skill:
          title: Technical skill
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        soft_skill:
          title: Soft skill
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        language:
          title: Language
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        salary:
          type: array
          items:
            title: Salary
            type: integer
            maximum: 2147483647
            minimum: -2147483648
        salary_currency:
          title: Salary currency
          type:
          - integer
          - 'null'
        show_salary:
          title: Show salary
          type: boolean
    CityName:
      title: City
      required:
      - title
      - code
      type: object
      properties:
        title:
          title: Title
          type: string
          maxLength: 200
          minLength: 1
        id:
          title: ID
          type: integer
          readOnly: true
        code:
          title: Code
          type: string
          minLength: 1
    ReturnValuePersonality:
      required:
      - fields
      type: object
      properties:
        fields:
          title: Fields
          type: string
        id:
          title: ID
          type: integer
          readOnly: true
    SuccessResponse:
      required:
      - message
      type: object
      properties:
        success:
          title: Success
          type: boolean
          default: true
        message:
          title: success message
          type: string
          minLength: 1
    ReturnJob:
      required:
      - title
      - country
      - city
      - opportunity_type
      - location_type
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          $ref: '#/components/schemas/ReturnJobRole'
        description:
          title: Description
          type:
          - string
          - 'null'
          minLength: 1
        is_active:
          title: Is active
          type: boolean
        is_public:
          title: Is public
          type: boolean
        salary:
          title: Salary
          type: string
          readOnly: true
        talents:
          title: Talents
          type: string
          readOnly: true
        created_at:
          title: Created at
          type: string
          format: date-time
        review:
          title: Review
          type:
          - string
          - 'null'
          enum:
          - accepted
          - declined
          - pending
        updated_at:
          title: Updated at
          type:
          - string
          - 'null'
          format: date-time
        company:
          title: Company
          type: string
          readOnly: true
        country:
          $ref: '#/components/schemas/CountryName'
        city:
          $ref: '#/components/schemas/CityName'
        opportunity_type:
          title: Opportunity type
          type: string
          enum:
          - full_time
          - part_time
          - freelance
          - internship
        location_type:
          title: Location type
          type: string
          enum:
          - remote_only
          - remote_and_location
          - location_only
        salary_currency:
          title: Salary currency
          type: string
          readOnly: true
    ReturnJobRole:
      title: Title
      required:
      - title
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        status:
          title: Status
          type: string
          enum:
          - accepted
          - declined
          - pending
    ReturnStepMatchRate:
      title: Matches
      required:
      - salary_currency
      type: object
      properties:
        values_match:
          title: Values match
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        personalities_match:
          title: Personalities match
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        technical_skill:
