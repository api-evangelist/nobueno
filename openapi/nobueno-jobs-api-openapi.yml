      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        status:
          title: Status
          type: string
          enum:
          - accepted
          - declined
          - pending
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
    Skill:
      required:
      - title
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        status:
          title: Status
          type: string
          enum:
          - accepted
          - declined
          - pending
        type:
          title: Type
          type: string
          enum:
          - technical
          - soft
          default: technical
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        reason:
          title: Reason
          type: string
          minLength: 1
        category_id:
          title: Category id
          type: string
          readOnly: true
    ReturnCountJob:
      required:
      - active
      - inactive
      type: object
      properties:
        active:
          title: Active
          type: integer
        inactive:
          title: Inactive
          type: integer
    CountryName:
      title: Country
      required:
