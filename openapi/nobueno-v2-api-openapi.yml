          items:
            title: Len employers
            type: integer
            maximum: 2147483647
            minimum: -2147483648
        description:
          title: Description
          type: string
          minLength: 1
        website:
          title: Website
          type:
          - string
          - 'null'
          maxLength: 300
          minLength: 1
    CompanyMedia:
      required:
