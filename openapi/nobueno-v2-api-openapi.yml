          title: Company
          type: string
          readOnly: true
        file:
          title: File
          type: string
          readOnly: true
          format: uri
    ReturnCompanyData:
      required:
      - title
      - years
      - description
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        title:
          title: Title
          type: string
          maxLength: 190
          minLength: 1
        image:
          title: Image
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        years:
          title: Years
          type: integer
          maximum: 2147483647
          minimum: -2147483648
