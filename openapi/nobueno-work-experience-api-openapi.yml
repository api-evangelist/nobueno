        required: false
        type: integer
      - name: perPage
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/JobSeekerWorkExperience'
      tags:
      - work-experience
    post:
      operationId: work-experience_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/JobSeekerWorkExperience'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/JobSeekerWorkExperience'
      tags:
      - work-experience
  /work-experience/{id}:
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this job seeker work experience.
      required: true
