      description: ''
      parameters: []
      responses:
        '204':
          description: ''
      tags:
      - work-experience
definitions:
  JobSeekerWorkExperience:
    required:
    - title
    - company
    - start_date
    type: object
    properties:
      id:
        title: Id
        type: integer
      created_at:
        title: Created at
        type: string
        format: date-time
        readOnly: true
      title:
        title: Title
        type: string
        maxLength: 300
        minLength: 1
      company:
        title: Company
        type: string
        maxLength: 190
        minLength: 1
      start_date:
        title: Start date
        type: string
        format: date
      end_date:
        title: End date
        type: string
        format: date
        x-nullable: true
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
  Device-type:
    type: apiKey
    name: Device-Type
    in: header
  x-scheme:
    type: apiKey
    name: x-scheme
    in: header
  x-app-id:
    type: apiKey
    name: x-app-id
    in: header
  REFETCH_SCHEMA_WITH_AUTH: true
